<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>DailyDone | Task</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<main class="container pb-5" style="max-width:850px">
 <a th:href="@{/}" class="text-decoration-none small">← Back to tasks</a>
 <div class="mt-3 mb-4"><p class="eyebrow mb-1">MAKE A PLAN</p><h1 class="h2 fw-bold" th:text="${task.taskId == null ? 'Create a task' : 'Edit task'}">Create a task</h1><p class="text-secondary">Write down what needs to get done, then take it one step at a time.</p></div>
 <form th:action="@{/tasks/save}" th:object="${task}" method="post" class="panel">
  <input type="hidden" th:field="*{taskId}">
  <div class="mb-3"><label class="form-label" for="title">Task title *</label><input id="title" class="form-control form-control-lg" th:field="*{title}" maxlength="120" placeholder="e.g. Finish OOP assignment" required><div class="text-danger small mt-1" th:errors="*{title}"></div></div>
  <div class="mb-3"><label class="form-label" for="description">Description</label><textarea id="description" class="form-control" th:field="*{description}" rows="3" maxlength="1000" placeholder="Add any useful details..."></textarea><div class="form-text">Optional, up to 1,000 characters.</div></div>
  <div class="row g-3">
   <div class="col-md-6"><label class="form-label" for="dueDate">Due date</label><input id="dueDate" type="date" class="form-control" th:field="*{dueDate}"></div>
   <div class="col-md-6"><label class="form-label" for="categoryId">Category</label><select id="categoryId" name="categoryId" class="form-select"><option value="">Uncategorized</option><option th:each="c : ${categories}" th:value="${c.categoryId}" th:text="${c.categoryName}" th:selected="${task.category != null and c.categoryId == task.category.categoryId}"></option></select></div>
   <div class="col-md-6"><label class="form-label" for="priority">Priority</label><select id="priority" class="form-select" th:field="*{priority}"><option th:each="p : ${priorities}" th:value="${p}" th:text="${p}"></option></select><div class="form-text">High = red · Medium = yellow · Low = green</div></div>
   <div class="col-md-6"><label class="form-label" for="status">Status</label><select id="status" class="form-select" th:field="*{status}"><option th:each="s : ${statuses}" th:value="${s}" th:text="${s.toString().replace('_',' ')}"></option></select></div>
  </div>
  <div class="d-flex gap-2 justify-content-end mt-4"><a th:href="@{/}" class="btn btn-light">Cancel</a><button class="btn btn-primary px-4" type="submit">Save task</button></div>
 </form>
 <p class="small text-secondary mt-3">Reminders are shown on the dashboard for overdue tasks and tasks due today or tomorrow.</p>
</main>
</body></html>
